<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cockpit — servers</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="assets/img/favicon.ico">
<script src="assets/js/proto.js"></script>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/frame.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .protobar {
    display: flex; align-items: center; gap: var(--s2);
    padding: var(--s2) var(--s4); border-bottom: 1px solid var(--ink-12); flex: none;
  }
  .protobar .spacer { flex: 1; }
  .protobar button {
    height: 26px; padding: 0 10px; background: transparent; color: var(--ink-60);
    border: 1px solid var(--ink-12); font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
  }
  .protobar button[aria-current='true'] { background: var(--color-ink); color: var(--color-paper); border-color: var(--color-ink); }
</style>
</head>
<body>

<div class="protobar">
  <span class="label">servers</span>
  <button aria-current="true">empty</button>
  <span class="spacer"></span>
  <button onclick="toggleTheme()">view <span data-theme-label>light</span></button>
  <button onclick="location.href='index.html'">index</button>
</div>

<div class="frame" data-rail="open" data-view="desktop">

  <nav class="rail">
    <a class="brand" href="#" data-health="healthy" title="cockpit">
      <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
        <path d="M1.25 1.25h29.5v29.5H1.25V1.25zm2.5 2.5v24.5h24.5V3.75H3.75z"/>
        <path d="M3.75 20h24.5v8.25H3.75z" data-ground/>
        <path d="M6.5 14.5h6.5v3H6.5zM14.5 14.5h3v3h-3zM19 14.5h6.5v3H19z"/>
      </svg>
      <span class="word">cockpit</span>
    </a>

    <div class="nav">
      <a href="#" aria-current="page" title="Servers">
        <svg viewBox="0 0 24 24"><path d="M3.5 4.5h17v5h-17zM3.5 14.5h17v5h-17zM6 7h2M6 17h2"/></svg>
        <span>Servers</span>
      </a>
      <a href="#" title="Plans">
        <svg viewBox="0 0 24 24"><path d="M3.5 5.5h17M3.5 12h10M3.5 18.5h13.5"/></svg>
        <span>Plans</span>
      </a>
      <a href="#" title="Activity">
        <svg viewBox="0 0 24 24"><path d="M2.5 12h4l3-7.5 4.5 15 3-7.5h4.5"/></svg>
        <span>Activity</span>
      </a>
      <div class="nav-sep"></div>
      <a href="#" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M2.5 8h19M2.5 16h19M8 5.5v5M16 13.5v5"/></svg>
        <span>Settings</span>
      </a>
    </div>

    <div class="rail-foot">
      <button class="who" title="oflabs44">
        <span class="avatar"></span>
        <span class="stack">
          <span class="name">oflabs44</span>
          <span class="label">owner</span>
        </span>
      </button>
    </div>
  </nav>

  <div class="main">
    <header class="bar">
      <button class="railtoggle" title="Toggle rail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="butt" stroke-linejoin="miter"><path d="M3.5 4.5h17v15h-17zM9.5 4.5v15"/></svg>
      </button>

      <a class="bar-mark" href="#" data-health="healthy" title="cockpit">
        <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
          <path d="M1.25 1.25h29.5v29.5H1.25V1.25zm2.5 2.5v24.5h24.5V3.75H3.75z"/>
          <path d="M3.75 20h24.5v8.25H3.75z" data-ground/>
          <path d="M6.5 14.5h6.5v3H6.5zM14.5 14.5h3v3h-3zM19 14.5h6.5v3H19z"/>
        </svg>
      </a>

      <div class="crumbs"><span class="here">Servers</span></div>
      <span class="spacer"></span>

      <button class="search">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M6.5 1a5.5 5.5 0 1 1-3.3 9.9l-2.1 2.1-1-1 2.1-2.1A5.5 5.5 0 0 1 6.5 1zm0 1.6a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 0 0 0-7.8z"/></svg>
        <span>Search or run</span>
        <kbd>&#8984;K</kbd>
      </button>

      <!-- No primary action in the bar when the screen is empty: the empty
           state already carries it, and two identical primaries on one screen
           is exactly the redundancy the frame contract is meant to prevent. -->
    </header>

    <div class="content">
      <div class="content-inner">

        <div class="empty animate-rise">
          <div class="empty-art">
            <!-- A slab lifting off a stack: a machine joining the fleet. Drawn
                 in the same hairlines as the rest of the UI, with faces filled
                 in paper so the upper forms occlude the lower ones. -->
            <svg viewBox="0 0 200 150" width="240" height="180"
                 fill="none" stroke="currentColor" stroke-width="1"
                 stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true">
              <!-- bottom slab -->
              <path d="M50 110 L100 137 L100 148 L50 121 Z" fill="var(--color-paper)"/>
              <path d="M100 137 L150 110 L150 121 L100 148 Z" fill="var(--color-paper)"/>
              <path d="M100 83 L150 110 L100 137 L50 110 Z" fill="var(--color-paper)"/>
              <path d="M112 140 L136 128"/>
              <!-- middle slab -->
              <path d="M50 99 L100 126 L100 137 L50 110 Z" fill="var(--color-paper)"/>
              <path d="M100 126 L150 99 L150 110 L100 137 Z" fill="var(--color-paper)"/>
              <path d="M100 72 L150 99 L100 126 L50 99 Z" fill="var(--color-paper)"/>
              <path d="M112 129 L136 117"/>
              <!-- alignment guides -->
              <path d="M50 66 L50 88" stroke-dasharray="2 3" opacity=".7"/>
              <path d="M150 66 L150 88" stroke-dasharray="2 3" opacity=".7"/>
              <path d="M100 93 L100 115" stroke-dasharray="2 3" opacity=".7"/>
              <!-- incoming slab -->
              <path d="M50 55 L100 82 L100 93 L50 66 Z" fill="var(--color-paper)"/>
              <path d="M100 82 L150 55 L150 66 L100 93 Z" fill="var(--color-paper)"/>
              <path d="M100 28 L150 55 L100 82 L50 55 Z" fill="var(--color-paper)"/>
              <path d="M112 85 L136 73"/>
            </svg>
          </div>

          <h2 class="empty-title">No servers yet</h2>
          <p class="empty-body">
            cockpit doesn't create machines &mdash; you bring a box you already own. Run one
            line on it and it enrols itself, with no SSH access handed over.
          </p>

          <div class="empty-actions">
            <button class="btn btn-primary btn-lg">Add server</button>
            <button class="btn btn-ghost btn-lg">Redeem a claim code</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
