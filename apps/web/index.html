
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cockpit</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <!-- Blocking, before any stylesheet (prototype/assets/js/proto.js's same IIFE): sets
         data-theme synchronously so the first paint is never the wrong theme, then flips to
         it once. A module script (theme-init.ts) runs after the CSS is already parsed. -->
    <script>
      (function () {
        var stored = null
        try {
          stored = localStorage.getItem('cockpit-theme')
        } catch (e) {}
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
